<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="80" fill="#0f0d0b"/>
  <!-- Heart with envelope -->
  <g transform="translate(256,280)" fill="none" stroke="#c9a96e" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <!-- Envelope body -->
    <rect x="-130" y="-70" width="260" height="170" rx="18" fill="#1a1714"/>
    <!-- Envelope flap -->
    <polyline points="-130,-70 0,30 130,-70"/>
    <!-- Heart inside -->
    <path d="M0,-5 C0,-5 -45,-50 -45,-25 C-45,-5 -25,10 0,35 C25,10 45,-5 45,-25 C45,-50 0,-5 0,-5Z" fill="#c9a96e" stroke="none" transform="translate(0,20) scale(0.9)"/>
  </g>
  <!-- Letter N -->
  <text x="256" y="145" text-anchor="middle" font-family="Georgia, serif" font-size="96" font-weight="bold" fill="#c9a96e">N</text>
</svg>
