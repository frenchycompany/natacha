<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Candidature Officielle 💌</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f0d0b;--border:#2e2a25;--accent:#c9a96e;--accent-soft:rgba(201,169,110,.12);--text:#e8e0d5;--muted:#7a7268;--sel-bg:rgba(201,169,110,.15);--sel-border:#c9a96e}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Cormorant Garamond',Georgia,serif;min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.04'/%3E%3C/svg%3E");pointer-events:none;z-index:999;opacity:.4}

/* ── Lang switcher ── */
.lang-bar{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;justify-content:flex-end;padding:.8rem 1.5rem;gap:.4rem;background:linear-gradient(to bottom,var(--bg) 60%,transparent)}
.lang-btn{font-family:'DM Mono',monospace;font-size:.65rem;letter-spacing:.15em;text-transform:uppercase;background:transparent;border:1px solid var(--border);color:var(--muted);padding:.3rem .7rem;cursor:pointer;transition:all .2s}
.lang-btn.active{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}

/* ── Intro ── */
.intro{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:5rem 2rem 2rem;text-align:center}
.ornament{font-size:3rem;margin-bottom:2rem;animation:float 3s ease-in-out infinite;display:block}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.intro h1{font-size:clamp(2rem,6vw,3.5rem);font-weight:300;letter-spacing:.02em;line-height:1.2;margin-bottom:1rem}
.intro h1 em{font-style:italic;color:var(--accent)}
.subtitle{font-family:'DM Mono',monospace;font-size:.75rem;color:var(--muted);letter-spacing:.15em;margin-bottom:3rem;max-width:400px;line-height:1.8}
.btn{background:transparent;border:1px solid var(--accent);color:var(--accent);font-family:'DM Mono',monospace;font-size:.75rem;letter-spacing:.2em;text-transform:uppercase;padding:1rem 2.5rem;cursor:pointer;transition:all .3s;position:relative;overflow:hidden}
.btn::before{content:'';position:absolute;inset:0;background:var(--accent);transform:translateX(-100%);transition:transform .3s;z-index:-1}
.btn:hover::before{transform:translateX(0)}
.btn:hover{color:var(--bg)}
.btn.primary{background:var(--accent);color:var(--bg)}
.btn.primary::before{display:none}
.btn.primary:hover{opacity:.85}

/* ── Questionnaire ── */
#questionnaire{display:none;max-width:720px;margin:0 auto;padding:5rem 2rem 6rem}
.q-header{text-align:center;margin-bottom:4rem;padding-bottom:2rem;border-bottom:1px solid var(--border)}
.tag{font-family:'DM Mono',monospace;font-size:.65rem;letter-spacing:.25em;text-transform:uppercase;color:var(--accent);margin-bottom:1rem;display:block}
.q-header h2{font-size:clamp(1.8rem,5vw,2.8rem);font-weight:300;font-style:italic;line-height:1.3}
.prog-wrap{position:sticky;top:0;z-index:10;background:var(--bg);padding:.75rem 0;margin-bottom:1rem;border-bottom:1px solid var(--border)}
.prog-info{display:flex;justify-content:space-between;margin-bottom:.5rem}
.prog-info span{font-family:'DM Mono',monospace;font-size:.65rem;letter-spacing:.1em;color:var(--muted)}
.prog-track{height:1px;background:var(--border)}
.prog-fill{height:100%;background:var(--accent);transition:width .5s ease;width:0%}
.qblock{margin-bottom:3rem;padding-bottom:3rem;border-bottom:1px solid var(--border);opacity:0;transform:translateY(20px);animation:fadeUp .5s ease forwards}
@keyframes fadeUp{to{opacity:1;transform:translateY(0)}}
.qnum{font-family:'DM Mono',monospace;font-size:.65rem;letter-spacing:.2em;color:var(--accent);margin-bottom:.75rem;display:block}
.qtext{font-size:1.3rem;font-weight:400;line-height:1.5;margin-bottom:1.5rem}
.opts{display:grid;gap:.5rem}
.opt{display:flex;align-items:flex-start;gap:1rem;padding:.9rem 1.2rem;border:1px solid var(--border);background:transparent;cursor:pointer;transition:all .2s;text-align:left;width:100%;color:var(--text);font-family:'Cormorant Garamond',serif;font-size:1.05rem;line-height:1.4}
.opt:hover{border-color:var(--accent);background:var(--accent-soft)}
.opt.selected{border-color:var(--sel-border);background:var(--sel-bg)}
.opt-letter{font-family:'DM Mono',monospace;font-size:.65rem;color:var(--accent);letter-spacing:.1em;flex-shrink:0;margin-top:.2rem}

/* ── Results ── */
#results{display:none;max-width:720px;margin:0 auto;padding:5rem 2rem 8rem;text-align:center}
.res-head{margin-bottom:3rem}
.big-emoji{font-size:3rem;display:block;margin-bottom:1.5rem;animation:float 3s ease-in-out infinite}
.res-head h2{font-size:clamp(2rem,5vw,3rem);font-weight:300;font-style:italic;line-height:1.3;margin-bottom:1rem}
.res-head p{color:var(--muted);font-family:'DM Mono',monospace;font-size:.7rem;letter-spacing:.12em}
.send-status{font-family:'DM Mono',monospace;font-size:.7rem;letter-spacing:.12em;margin-top:.75rem;min-height:1.2em}
.send-status.ok{color:var(--accent)}.send-status.err{color:#c96e6e}.send-status.sending{color:var(--muted)}
.ans-list{text-align:left;margin:3rem 0}
.ans-item{display:grid;grid-template-columns:auto 1fr auto;gap:1rem;align-items:start;padding:1.2rem 0;border-bottom:1px solid var(--border);opacity:0;transform:translateY(10px)}
.ans-item.vis{animation:fadeUp .4s ease forwards}
.ans-num{font-family:'DM Mono',monospace;font-size:.6rem;color:var(--muted);letter-spacing:.1em;padding-top:.15rem}
.ans-q{font-size:.95rem;color:var(--muted);line-height:1.4}
.ans-q strong{display:block;color:var(--text);font-size:1.05rem;margin-bottom:.2rem;font-weight:400}
.ans-choice{font-family:'DM Mono',monospace;font-size:.7rem;color:var(--accent);background:var(--accent-soft);border:1px solid rgba(201,169,110,.3);padding:.3rem .6rem;white-space:nowrap}
.deco{display:flex;align-items:center;gap:1rem;margin:2rem 0;color:var(--border)}
.deco::before,.deco::after{content:'';flex:1;height:1px;background:var(--border)}
.deco span{font-size:.8rem;color:var(--accent)}
@media(max-width:480px){#questionnaire,#results{padding:4rem 1.2rem 5rem}.qtext{font-size:1.15rem}.ans-item{grid-template-columns:auto 1fr}.ans-choice{grid-column:2}}
</style>
</head>
<body>

<!-- Lang switcher -->
<div class="lang-bar">
  <button class="lang-btn active" id="btn-fr" onclick="setLang('fr')">FR</button>
  <button class="lang-btn" id="btn-ru" onclick="setLang('ru')">RU</button>
</div>

<!-- INTRO -->
<div class="intro" id="intro">
  <span class="ornament">💌</span>
  <h1 id="intro-title">Candidature officielle<br>pour devenir… <em>ma femme</em></h1>
  <p class="subtitle" id="intro-sub">Réponds honnêtement… ou stratégiquement.<br>Je ferai la différence.</p>
  <button class="btn" onclick="startQuestionnaire()" id="intro-btn">Ouvrir le questionnaire</button>
</div>

<!-- QUESTIONNAIRE -->
<div id="questionnaire">
  <div class="q-header">
    <span class="tag" id="q-tag">Dossier confidentiel</span>
    <h2 id="q-title">Les 25 questions qui décideront de ton sort 😏</h2>
  </div>
  <div class="prog-wrap">
    <div class="prog-info">
      <span id="prog-text">0 / 25</span>
      <span id="prog-pct">0%</span>
    </div>
    <div class="prog-track"><div class="prog-fill" id="prog-fill"></div></div>
  </div>
  <div id="qcontainer"></div>
  <div style="text-align:center;margin-top:2rem">
    <button class="btn primary" id="submit-btn" style="display:none" onclick="submitAnswers()" id="submit-btn">
      <span id="submit-label">Soumettre ma candidature</span>
    </button>
  </div>
</div>

<!-- RESULTS -->
<div id="results">
  <div class="res-head">
    <span class="big-emoji">✨</span>
    <h2 id="res-title">Candidature soumise avec succès</h2>
    <p id="res-sub">Tes réponses ont été transmises</p>
    <div class="send-status sending" id="send-status"></div>
  </div>
  <div class="deco"><span>◆</span></div>
  <div class="ans-list" id="ans-list"></div>
</div>

<script>
// ── Translations ──────────────────────────────────────────────────────────────
const T = {
  fr: {
    introTitle: 'Candidature officielle<br>pour devenir… <em>ma femme</em>',
    introSub: 'Réponds honnêtement… ou stratégiquement.<br>Je ferai la différence.',
    introBtn: 'Ouvrir le questionnaire',
    qTag: 'Dossier confidentiel',
    qTitle: 'Les 25 questions qui décideront de ton sort 😏',
    submitLabel: 'Soumettre ma candidature',
    resTitle: 'Candidature soumise avec succès',
    resSub: 'Tes réponses ont été transmises',
    sending: 'Envoi en cours…',
    sent: '✓ Réponses envoyées et sauvegardées',
    error: '✗ Erreur d\'envoi — réponses sauvegardées localement',
    progLabel: (n) => `${n} / 25`,
  },
  ru: {
    introTitle: 'Официальная заявка<br>чтобы стать… <em>моей женой</em> 😏',
    introSub: 'Отвечай честно… или стратегически.\nЯ почувствую разницу.',
    introBtn: 'Открыть анкету',
    qTag: 'Конфиденциальное досье',
    qTitle: '25 вопросов, которые решат твою судьбу 😏',
    submitLabel: 'Подать заявку',
    resTitle: 'Заявка успешно подана',
    resSub: 'Твои ответы переданы',
    sending: 'Отправка…',
    sent: '✓ Ответы отправлены и сохранены',
    error: '✗ Ошибка отправки — ответы сохранены локально',
    progLabel: (n) => `${n} / 25`,
  }
};

const questions = {
  fr: ["Comment es-tu passée du statut de « simple curiosité » à « vraiment intéressante » ?","Comment tu comptes gérer un homme comme moi ?","Comment tu réagis à mon imprévisibilité ?","Comment tu imagines le moment idéal avec moi ?","Comment tu comptes me conquérir définitivement ?","Comment tu gères le fait que je peux être… séduisant ?","Comment tu décrirais nos moments à deux ?","Comment tu te sens quand on est ensemble ?","Comment tu vis le fait qu'on se rapproche ?","Comment tu vois ma place dans ta vie en ce moment ?","Comment tu définis notre connexion ?","Comment tu te comportes quand tu commences à t'attacher ?","Comment tu sais qu'une personne est devenue importante pour toi ?","Comment tu vis le contrôle dans une relation ?","Comment tu vis les surprises ?","Comment tu réagis quand tu te sens comprise ?","Quel est mon principal défaut ?","Comment tu réagis quand quelqu'un prend beaucoup de place dans ta vie ?","Comment tu te comportes quand tu es vraiment bien avec quelqu'un ?","Comment tu vois la suite de ce qui se passe entre nous ?","Comment tu te comportes quand quelqu'un te manque mais que tu ne veux pas le montrer ?","Comment tu équilibres jeu et sérieux ?","Comment tu évalues ton « niveau de danger » émotionnel ?","Comment tu réagis quand ça devient vraiment sérieux ?","Comment tu évalues ta « candidature » en ce moment ?"],
  ru: ["Как тебе удалось перейти из статуса «просто любопытство» в «действительно интересная»?","Как ты собираешься справляться с таким мужчиной, как я?","Как ты реагируешь на мою непредсказуемость?","Как ты представляешь идеальный момент со мной?","Как ты собираешься окончательно меня покорить?","Как ты справляешься с тем, что я… могу быть привлекательным?","Как бы ты описала наши моменты вдвоём?","Как ты себя чувствуешь, когда мы вместе?","Как ты относишься к тому, что мы сближаемся?","Как ты видишь моё место в своей жизни сейчас?","Как ты определяешь нашу связь?","Как ты ведёшь себя, когда начинаешь привязываться?","Как ты понимаешь, что человек стал для тебя важным?","Как ты относишься к контролю в отношениях?","Как ты относишься к сюрпризам?","Как ты реагируешь, когда тебя понимают?","Какой мой главный недостаток?","Как ты реагируешь, когда кто-то занимает много места в твоей жизни?","Как ты ведёшь себя, когда тебе действительно хорошо с кем-то?","Как ты видишь продолжение того, что происходит между нами?","Как ты ведёшь себя, когда кто-то тебе не хватает, но ты не хочешь это показывать?","Как ты балансируешь между игрой и серьёзностью?","Как ты оцениваешь свою эмоциональную «опасность»?","Как ты реагируешь, когда всё становится по-настоящему серьёзным?","Как ты оцениваешь свою «кандидатуру» сейчас?"]
};

const options = {
  fr: [["Progressivement","Je ne m'en suis pas rendu compte","Grâce à toi","J'ai toujours été comme ça"],["Avec patience","Avec intelligence","Avec humour","C'est impossible… je m'adapte juste"],["Je tiens bon","Je m'ajuste","J'en rajoute","Ça me plaît"],["Simple et calme","Spontané","Léger et fun","Avec un soupçon de danger 😏"],["En étant moi-même","En jouant un peu","En te laissant faire le premier pas","C'est déjà fait"],["Je résiste","J'observe","Je cède un peu","Il est déjà trop tard pour moi"],["Simples mais importants","Légers et naturels","Intenses mais pas compliqués","Trop prenants"],["Bien","Apaisée","Vivante","Dangereusement bien"],["Je laisse faire","Je prends parfois mes distances","J'en profite simplement","Prudemment… mais ça me plaît"],["Importante","Elle devient importante","Elle se construit","Elle est déjà prise"],["Naturelle","Rare","Évidente","Difficile à expliquer"],["Avec retenue","Avec prudence","Naturellement","Je me rapproche"],["Je pense à elle","Je lui fais de la place","Je m'investis","Je le sens, c'est tout"],["J'aime contrôler","Je lâche prise progressivement","Ça dépend","Je me laisse porter"],["J'adore","Avec modération","Si elles sont bonnes","J'en veux plus"],["Ça m'apaise","Ça m'étonne","Je m'ouvre","Je m'attache"],["Trop… (complète 😏)","Pas assez…","Difficile à cerner","Aucun (suspect)"],["Je régule","Je m'adapte","J'accepte","Qu'il reste"],["Je me détends","Je m'ouvre davantage","Je suis plus tactile","Je deviens un peu dépendante"],["On continue comme ça","On approfondit","On laisse évoluer","On verra"],["Je me retiens","Je compense","Ça se voit quand même","Je passe vite à autre chose"],["Plutôt jeu","Plutôt sérieux","Équilibre","Ça dépend de la personne"],["Faible","Moyen","Élevé","À tes risques et périls 😏"],["Je ralentis","J'observe","J'accepte","Je plonge"],["En phase de test","À confirmer","Prometteuse","Déjà validée 😏"]],
  ru: [["Постепенно","Я сама не заметила","Благодаря тебе","Я всегда такой была"],["С терпением","С умом","С юмором","Это невозможно… я просто адаптируюсь"],["Держусь","Подстраиваюсь","Добавляю ещё","Мне это нравится"],["Простой и спокойный","Спонтанный","Лёгкий и весёлый","С лёгкой опасностью 😏"],["Буду собой","Немного поиграю","Дам тебе сделать шаг","Уже получилось"],["Сопротивляюсь","Наблюдаю","Немного сдаюсь","Уже поздно для меня"],["Простые, но важные","Лёгкие и естественные","Интенсивные, но не сложные","Слишком затягивающие"],["Хорошо","Спокойно","Живо","Опасно приятно"],["Пусть всё идёт само","Иногда беру дистанцию","Просто наслаждаюсь","Осторожно… но мне нравится"],["Важное","Становится важным","Пока строится","Уже занято"],["Естественная","Редкая","Очевидная","Сложно объяснить"],["Сдержанно","Осторожно","Естественно","Становлюсь ближе"],["Думаю о нём","Освобождаю для него место","Вкладываюсь","Просто чувствую"],["Люблю контролировать","Постепенно отпускаю","Зависит","Плыву по течению"],["Обожаю","В меру","Если они хорошие","Хочу больше"],["Это успокаивает","Удивляет","Я открываюсь","Я привязываюсь"],["Слишком… (дополни 😏)","Недостаточно…","Сложно понять","Нет (подозрительно)"],["Регулирую","Подстраиваюсь","Принимаю","Пусть будет"],["Расслабленно","Более открыто","Более тактильно","Немного зависима"],["Продолжаем так","Углубляем","Пусть развивается","Посмотрим"],["Сдерживаюсь","Компенсирую","Это всё равно видно","Быстро отпускаю"],["Больше игра","Больше серьёзность","Баланс","Зависит от человека"],["Низкая","Средняя","Высокая","На твой риск 😏"],["Замедляюсь","Наблюдаю","Принимаю","Погружаюсь"],["На этапе теста","Нужно подтвердить","Многообещающая","Уже одобрена 😏"]]
};

const letters = ['A','B','C','D'];
let lang = 'fr';
let answers = new Array(25).fill(null);
let rendered = false;

function setLang(l) {
  lang = l;
  document.getElementById('btn-fr').classList.toggle('active', l === 'fr');
  document.getElementById('btn-ru').classList.toggle('active', l === 'ru');
  const t = T[l];
  document.getElementById('intro-title').innerHTML = t.introTitle;
  document.getElementById('intro-sub').innerHTML = t.introSub;
  document.getElementById('intro-btn').textContent = t.introBtn;
  document.getElementById('q-tag').textContent = t.qTag;
  document.getElementById('q-title').textContent = t.qTitle;
  document.getElementById('submit-label').textContent = t.submitLabel;
  document.documentElement.lang = l;
  if (rendered) rerenderQuestions();
}

function startQuestionnaire() {
  document.getElementById('intro').style.display = 'none';
  document.getElementById('questionnaire').style.display = 'block';
  renderQuestions();
  rendered = true;
  window.scrollTo(0,0);
}

function renderQuestions() {
  const c = document.getElementById('qcontainer');
  c.innerHTML = '';
  answers = new Array(25).fill(null);
  questions[lang].forEach((q, qi) => {
    const block = document.createElement('div');
    block.className = 'qblock';
    block.style.animationDelay = `${qi * 0.04}s`;
    block.innerHTML = `
      <span class="qnum">— ${String(qi+1).padStart(2,'0')} / 25</span>
      <div class="qtext">${q}</div>
      <div class="opts" id="opts-${qi}">
        ${options[lang][qi].map((o,oi) => `
          <button class="opt" onclick="pick(${qi},${oi})" id="opt-${qi}-${oi}">
            <span class="opt-letter">${letters[oi]}</span>
            <span>${o}</span>
          </button>`).join('')}
      </div>`;
    c.appendChild(block);
  });
  updateProg();
}

function rerenderQuestions() {
  const saved = [...answers];
  renderQuestions();
  saved.forEach((ai, qi) => { if (ai !== null) { answers[qi] = ai; document.getElementById(`opt-${qi}-${ai}`)?.classList.add('selected'); } });
  updateProg();
}

function pick(qi, oi) {
  for (let i = 0; i < 4; i++) document.getElementById(`opt-${qi}-${i}`)?.classList.remove('selected');
  document.getElementById(`opt-${qi}-${oi}`)?.classList.add('selected');
  answers[qi] = oi;
  updateProg();
}

function updateProg() {
  const n = answers.filter(a => a !== null).length;
  const pct = Math.round(n / 25 * 100);
  document.getElementById('prog-text').textContent = T[lang].progLabel(n);
  document.getElementById('prog-pct').textContent = pct + '%';
  document.getElementById('prog-fill').style.width = pct + '%';
  const btn = document.getElementById('submit-btn');
  if (n === 25) { btn.style.display = 'inline-block'; }
}

async function submitAnswers() {
  document.getElementById('questionnaire').style.display = 'none';
  document.getElementById('results').style.display = 'block';
  window.scrollTo(0,0);

  const status = document.getElementById('send-status');
  status.className = 'send-status sending';
  status.textContent = T[lang].sending;

  // Afficher les réponses
  const list = document.getElementById('ans-list');
  list.innerHTML = '';
  const qs = questions[lang];
  const os = options[lang];
  answers.forEach((ai, qi) => {
    const item = document.createElement('div');
    item.className = 'ans-item';
    item.innerHTML = `
      <span class="ans-num">${String(qi+1).padStart(2,'0')}</span>
      <div class="ans-q"><strong>${qs[qi]}</strong>${ai !== null ? os[qi][ai] : '—'}</div>
      ${ai !== null ? `<span class="ans-choice">${letters[ai]}</span>` : ''}`;
    list.appendChild(item);
    setTimeout(() => item.classList.add('vis'), qi * 55);
  });

  // Envoi
  try {
    const res = await fetch('send.php', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ lang, answers })
    });
    const data = await res.json();
    status.className = data.success ? 'send-status ok' : 'send-status err';
    status.textContent = data.success ? T[lang].sent : T[lang].error;
  } catch(e) {
    status.className = 'send-status err';
    status.textContent = T[lang].error;
  }
}

// Init
setLang('fr');
</script>
</body>
</html>
